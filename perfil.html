<!-- TEAM POKÉMON (ALE) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p><button type="button" command="show-modal" commandfor="ver-equipo">
        Team Pokémon
    </button></p>

    
    <dialog id="ver-equipo">
        <h3>Team Pokémon</h3>
        <p>5 de 6 espacios ocupados</p>
        
        <ul>
            <li>
                <section>
                    <img class="pokemon-card__image" src="assets/bulbasaur.png" alt="Bulbasaur" width="96" height="96">
                    <p>#001</p>
                    <p>Bulbasaur</p>
                    <p><button type="button" command="show-modal" commandfor="vacio-por-ahora">Quitar</button></p>
            
                </section>
            </li>
            <li>
                <section>
                    <img class="pokemon-card__image" src="assets/ivysaur.png" alt="Ivysaur" width="96" height="96">
                    <p>#002</p>
                    <p>Ivysaur</p>
                    <p><button type="button" command="show-modal" commandfor="vacio-por-ahora">Quitar</button></p>
            
                </section>
            </li>
            <li>
                <section>
                    <img class="pokemon-card__image" src="assets/venusaur.png" alt="Venusaur" width="96" height="96">
                    <p>#003</p>
                    <p>Venusaur</p>
                    <p><button type="button" command="show-modal" commandfor="vacio-por-ahora">Quitar</button></p>
            
                </section>
            </li>
            <li>
                <section>
                    <img class="pokemon-card__image" src="assets/charmander.png" alt="Charmander" width="96" height="96">
                    <p>#004</p>
                    <p>Charmander</p>
                    <p><button type="button" command="show-modal" commandfor="vacio-por-ahora">Quitar</button></p>
                </section>
            </li>
            <li>
                <section>
                    <img class="pokemon-card__image" src="assets/charmeleon.png" alt="Charmaleon" width="96" height="96">
                    <p>#005</p>
                    <p>Charmeleon</p>
                    <p><button type="button" command="show-modal" commandfor="vacio-por-ahora">Quitar</button></p>
                </section>
            </li>
            <li>
                <section>
                    <p>Espacio libre</p>
                </section>
            </li>
        </ul>
        
        
        <button type="button" command="close" commandfor="ver-equipo">Cerrar</button>
        <button type="button" command="close" commandfor="ver-equipo">Agregar desde capturados</button>
    </dialog>
    


</body>
</html>
